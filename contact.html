<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/shared.css">
    <link rel="stylesheet" href="assets/styles/contact_page.css">
    <title>Nexus — Backend Engineer</title>
</head>

<body>

    <div class="container">

        <header class="contact-header">
            <a href="index.html#contact" class="back-link">
                <i class="ri-arrow-left-line" aria-hidden="true"></i>
                Back home
            </a>
        </header>

        <main class="contact-main">

            <div class="contact-intro">
                <h1>Let's talk.</h1>

                <p>
                    Have a project, an idea, or just want to say hello?
                    Send me a message and I'll get back to you within 24 hours.
                </p>
            </div>

            <form
                class="contact-form"
                action="https://api.web3forms.com/submit"
                method="POST"
                id="contactForm">

                <input type="hidden" name="access_key" value="f83732dd-8a98-44cc-803f-33e40ec5c365">
                <input type="hidden" name="subject" value="New message from Nexus">
                <input type="checkbox" name="botcheck" style="display: none;">

                <div class="form-field">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        autocomplete="name"
                        required>
                </div>

                <div class="form-field">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-field">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        placeholder="What's on your mind?"
                        rows="6"
                        required></textarea>
                </div>

                <button type="submit" class="submit-button" id="submitButton">
                    <span id="submitText">Send message</span>
                    <i class="ri-arrow-right-up-line" id="submitIcon" aria-hidden="true"></i>
                </button>

                <p class="form-status" id="formStatus"></p>

            </form>

        </main>

        <footer class="site-footer">

            <div>
                <p>&copy; <span id="year"></span> — 8bitnexus.pages.dev made with ❤.</p>
            </div>

            <div class="footer-links">
                <a href="https://github.com" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                    <i class="ri-github-fill"></i>
                </a>

                <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                    <i class="ri-linkedin-box-fill"></i>
                </a>

                <a href="/blog" aria-label="Blog">
                    <i class="ri-quill-pen-ai-fill"></i>
                </a>
            </div>

        </footer>

    </div>

    <script src="assets/scripts/root.js"></script>
    <script src="assets/scripts/contact.js"></script>

</body>

</html>
